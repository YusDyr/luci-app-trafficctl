name: Feature Build

# Builds IPK + APK from any feature/* branch and publishes them as a
# floating pre-release so the download URLs stay stable across pushes.
#
# Release tag:  build-feature-<branch-slug>
# Download URLs (both packages are needed: trafficctl is the backend,
# luci-app-trafficctl the web interface):
#   …/releases/download/build-feature-<slug>/trafficctl.ipk
#   …/releases/download/build-feature-<slug>/luci-app-trafficctl.ipk
#   …/releases/download/build-feature-<slug>/trafficctl.apk
#   …/releases/download/build-feature-<slug>/luci-app-trafficctl.apk

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    name: Build IPK
    runs-on: ubuntu-latest
    outputs:
      tag:  ${{ steps.meta.outputs.tag }}
      sha:  ${{ steps.meta.outputs.sha }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive metadata
        id: meta
        run: |
          SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '_' '-' | sed 's/[^a-zA-Z0-9-]//g')
          SHA="${GITHUB_SHA:0:7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "safe=$SAFE"         >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"           >> "$GITHUB_OUTPUT"
          echo "tag=build-${SAFE}"  >> "$GITHUB_OUTPUT"
          echo "date=$DATE"         >> "$GITHUB_OUTPUT"

      # Before the build: the test builds into dist/ itself and empties it.
      - name: Smoke-test the IPK builder
        run: bash tests/test_build_ipk.sh

      - name: Build .ipk
        run: |
          ./build-ipk.sh "0.0.0-${{ steps.meta.outputs.sha }}" 0
          ln -f dist/trafficctl_*_all.ipk dist/trafficctl.ipk
          ln -f dist/luci-app-trafficctl_*_all.ipk dist/luci-app-trafficctl.ipk

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ipk
          path: |
            dist/trafficctl.ipk
            dist/luci-app-trafficctl.ipk

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Makefile version
        run: |
          SHA="${GITHUB_SHA:0:7}"
          for mk in luci-app-trafficctl/Makefile trafficctl/Makefile; do
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=0.0.0-${SHA}/" "$mk"
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=0/"            "$mk"
          done

      - name: Build .apk via OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.4
          FEEDNAME: trafficctl
          PACKAGES: trafficctl luci-app-trafficctl
          V: sc

      - name: Collect APK
        run: |
          # The SDK names them <name>-<version>.apk; "<name>-[0-9]*" keeps
          # trafficctl from matching luci-app-trafficctl.
          for pkg in trafficctl luci-app-trafficctl; do
            APK=$(find bin/ -name "${pkg}-[0-9]*.apk" 2>/dev/null | head -1)
            if [ -z "$APK" ]; then
              echo "::error::$pkg APK not found in SDK output"
              find bin/ -type f -name "*.apk" || true
              exit 1
            fi
            cp "$APK" "$pkg.apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: |
            trafficctl.apk
            luci-app-trafficctl.apk

  publish:
    name: Publish pre-release
    runs-on: ubuntu-latest
    needs: [build-ipk, build-apk]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist/

      - name: Delete previous floating release (if any)
        run: |
          TAG="${{ needs.build-ipk.outputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create pre-release
        run: |
          TAG="${{ needs.build-ipk.outputs.tag }}"
          SHA="${{ needs.build-ipk.outputs.sha }}"
          DATE="${{ needs.build-ipk.outputs.date }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          gh release create "$TAG" dist/trafficctl.ipk dist/luci-app-trafficctl.ipk \
            dist/trafficctl.apk dist/luci-app-trafficctl.apk \
            --prerelease \
            --title "Dev: ${BRANCH} @ ${SHA}" \
            --notes "$(cat <<NOTES
          ## Dev build — \`${BRANCH}\`

          Built from [\`${SHA}\`](https://github.com/${REPO}/commit/${GITHUB_SHA}) · ${DATE}

          > ⚠️ Pre-release for testing only — not for production.

          | File | OpenWrt version | Command |
          |------|----------------|---------|
          | \`trafficctl.ipk\` + \`luci-app-trafficctl.ipk\` | 22.03 – 24.10 | \`opkg install <url> <url>\` |
          | \`trafficctl.apk\` + \`luci-app-trafficctl.apk\` | 25.12+ | \`apk add --allow-untrusted <url> <url>\` |

          ### Install

          Both packages in one command: trafficctl is the backend,
          luci-app-trafficctl the web interface.

          \`\`\`sh
          # OpenWrt 22.03 – 24.10
          opkg install https://github.com/${REPO}/releases/download/${TAG}/trafficctl.ipk \\
            https://github.com/${REPO}/releases/download/${TAG}/luci-app-trafficctl.ipk

          # OpenWrt 25.12+
          apk add --allow-untrusted https://github.com/${REPO}/releases/download/${TAG}/trafficctl.apk \\
            https://github.com/${REPO}/releases/download/${TAG}/luci-app-trafficctl.apk
          \`\`\`
          NOTES
          )"
