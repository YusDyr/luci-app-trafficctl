name: OpenWrt Compatibility

on:
  # No push trigger on purpose. On a push to main this matrix ALSO runs inside
  # auto-release.yml, which gates the release on it — so a standalone run here
  # doubled the most expensive job in the repository and told us nothing the
  # gating run does not. It still runs in full on every pull request.
  pull_request:
    branches: [main, 'feature/**', 'ucode/**']
  workflow_call:
    inputs:
      package_artifact:
        description: >
          Name of an artifact that already holds the built packages. When
          given, this workflow does NOT build its own — it tests the exact
          bytes the caller built. Empty (the default, and always the case on a
          pull request) means build them here.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Superseded runs on the same pull request are cancelled; nothing else is.
#
# The gating is the whole point here. This workflow is also reached through
# workflow_call from auto-release.yml, and a release must never be cancelled by
# a later push — so cancel-in-progress is true only for pull_request events.
#
# The group is keyed on the PR number, falling back to the run id when there is
# no PR. That fallback matters: on a push to main this workflow runs both
# standalone and nested inside the release run, and a shared group with
# cancel-in-progress false would make one QUEUE BEHIND the other instead of
# running alongside it. A per-run group keeps them independent.
#
# Measured cause: on 2026-09-29 nine compat runs across three branches were in
# flight at once (four of them superseded commits on one branch), 153 jobs
# against the hosted limit, and runs stretched to 34-55 minutes against a 24-27
# minute uncontended baseline.
concurrency:
  # A LITERAL name, not ${{ github.workflow }}. Inside a workflow_call that
  # expression resolves to the CALLER's workflow name, so ci.yml, compat.yml and
  # feed-install.yml all computed the same group when the release called them —
  # 'Auto Release-pr-<run_id>' — and GitHub serialised the three against each
  # other. With cancel-in-progress false a group holds one running and one
  # pending run, so whichever of the three was queued got CANCELLED when the
  # third arrived.
  #
  # Measured on release run 38299207220: feeds took the slot at 19:54:25, ci sat
  # queued for twenty minutes, and the moment compat became eligible (20:14:57,
  # one second after the build finished) ci was cancelled. publish needs ci, so
  # it was skipped and #92 was merged without ever being released. The same
  # serialisation is visible in the runs that did succeed: compat's matrix
  # started in the same second feeds finished.
  group: compat-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # gh release download in the upgrade job needs read access to releases
  # (covered by the default GITHUB_TOKEN's contents: read above)

jobs:
  # Skipped entirely when the caller already has the packages. On a push to
  # main that is the release build, and the duplication it removes was the
  # single largest cost in the repository: the same package, for the same
  # architecture, was built TWICE per release — `Build the artifacts` (20m45s,
  # real version) and this job (30m52s, 0.0.0-test) — concurrently, and the
  # matrix that consumes the result then finishes in 20 seconds. Measured on
  # run 36936909066. Reusing the release build also means the matrix exercises
  # the exact artifact that ships rather than a separate build of the same
  # tree.
  #
  # The honest figure: the release goes from ~32 minutes to ~24, not to ~21.
  # Gating this workflow on the build in order to reuse its packages also
  # gated the feed-install check, which depends on nothing and had always run
  # alongside the build — that alone would have made the release LONGER (~46
  # minutes), so feed-install now lives in its own ungated workflow. With it
  # parallel again the pole is the feed check at ~24 minutes, not this build.
  # Measured on run 38086343117.
  #
  # Rejected alternative, for the record: carrying a warm SDK build tree
  # between runs so that both builds get cheap. Measured on 2026-10-09 and it
  # does not work. The SDK image declares `VOLUME /builder`, so the tree
  # cannot be baked into an image at all (docker commit and a child
  # Dockerfile's RUN both discard writes to a VOLUME path); carried in a named
  # volume instead, the warm pass came in at 22m30s against 25m48s cold, which
  # is inside the run-to-run noise — two cold passes on the same commit
  # differed by 42% (18m13s vs 25m48s). The reason is visible in the log:
  # entrypoint.sh runs `./scripts/feeds update -a` unconditionally, the fresh
  # feed checkouts give every package Makefile a new mtime, and `make` then
  # clean-builds the toolchain and all 45 dependencies regardless.
  #
  # tools/sdk-cache.sh (the "OpenWrt SDK cache" steps below) gets round both
  # problems: it restores into the container instead of baking an image, and
  # it restores the feed checkouts too, with their nanosecond mtimes. With the
  # checkout present and its commit pinned in feeds.conf, `feeds update`
  # leaves it alone, so the dependencies' stamps stay valid and only our two
  # packages, which are never cached, are compiled.
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    env:
      # The SDK image tag, shared by the cache key and the build.
      SDK_ARCH: x86_64-25.12.4
    if: ${{ inputs.package_artifact == '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Build .ipk (standalone)
        run: |
          ./build-ipk.sh 0.0.0-test 1
          cp dist/*.ipk /tmp/

      # Carries the SDK's downloads, feed checkouts and compiled dependencies
      # between runs; our own packages are never in it (tools/sdk-cache.sh).
      # Keyed on the image digest and the packages' DEPENDS, so a new SDK
      # image or a new dependency makes a new entry, seeded from the last one.
      - name: Compute the OpenWrt SDK cache key
        id: sdk_cache_key
        run: |
          IMAGE="ghcr.io/openwrt/sdk:$SDK_ARCH"
          for i in 1 2 3; do
            docker pull -q "$IMAGE" && break
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
          read -r key prefix < <(tools/sdk-cache.sh key "$IMAGE" tools/sdk-entrypoint.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "SDK cache key: $key"

      - name: Restore the OpenWrt SDK cache
        id: sdk_cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: ${{ steps.sdk_cache_key.outputs.key }}
          restore-keys: ${{ steps.sdk_cache_key.outputs.prefix }}

      - name: Build .apk (via OpenWrt SDK, signed)
        # 17-36 min across the last 22 successful runs of each workflow. With
        # no limit a stalled SDK download holds the job for GitHub's 6 h
        # default; 60 min fails it instead, and the check can be re-run.
        timeout-minutes: 60
        # tools/sdk-build.sh runs the SDK image as openwrt/gh-action-sdk v11
        # does, but without its setup.sh re-download of the SDK the image
        # already contains (that download is what hit the limit).
        run: tools/sdk-build.sh
        env:
          ARCH: ${{ env.SDK_ARCH }}
          SDK_CACHE: ${{ runner.temp }}/sdk-cache
          # An exact hit is saved already; rewriting the archive would be waste.
          SDK_CACHE_SAVE: ${{ steps.sdk_cache.outputs.cache-hit == 'true' && '0' || '1' }}
          FEEDNAME: trafficctl
          PACKAGES: trafficctl luci-app-trafficctl
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          V: sc
          KEY_BUILD: ${{ secrets.USIGN_PRIVATE_KEY }}

      - name: Collect APK
        run: |
          mkdir -p dist
          cp /tmp/luci-app-trafficctl*.ipk /tmp/trafficctl_*.ipk dist/ 2>/dev/null || true
          # The web interface and the backend (trafficctl-<ver>.apk). -name
          # matches the whole basename, so "trafficctl-[0-9]*" cannot pick up
          # luci-app-trafficctl-*.
          for pkg in luci-app-trafficctl trafficctl; do
            APK=$(find bin/ -name "${pkg}-[0-9]*.apk" 2>/dev/null | head -1)
            if [ -z "$APK" ]; then
              echo "::error::$pkg APK not found in SDK output"
              find bin/ -type f -name "*.apk" || true
              exit 1
            fi
            cp "$APK" "dist/${pkg}_0.0.0-test_noarch.apk"
          done
          # Version-free aliases, matching the ones the release build already
          # creates. Every consumer below addresses the packages through these,
          # so the same job works whether the artifact was built here with a
          # 0.0.0-test version or handed over from a release build with a real
          # one. The names used to be hardcoded per consumer, which is what
          # made reuse impossible.
          ln -f dist/luci-app-trafficctl_0.0.0-test-1_all.ipk dist/luci-app-trafficctl.ipk
          ln -f dist/luci-app-trafficctl_0.0.0-test_noarch.apk dist/luci-app-trafficctl.apk
          ln -f dist/trafficctl_0.0.0-test-1_all.ipk dist/trafficctl.ipk
          ln -f dist/trafficctl_0.0.0-test_noarch.apk dist/trafficctl.apk
          ls -l dist/

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/

  compat:
    name: ${{ matrix.version }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-packages
    # build-packages is SKIPPED in the reuse case, and a job with an unmet
    # `needs` is skipped too — which would silently turn the whole matrix
    # green-by-absence on every release. The result is therefore tested
    # explicitly: run unless it actually failed.
    if: ${{ !cancelled() && needs.build-packages.result != 'failure' }}
    strategy:
      fail-fast: false
      # x86-64 only, on purpose. luci-app-trafficctl is Architecture: all
      # (pure shell + JavaScript, no compiled code), so behaviour does not vary
      # by CPU arch — only by OpenWrt version (opkg vs apk, conffile handling).
      # We therefore test every supported version on x86-64, which is
      # representative. Non-x86-64 arches were previously listed but never ran:
      # OpenWrt publishes its rootfs container images for linux/amd64 only, so
      # `docker pull` of an aarch64/arm/mips/i386 rootfs fails with "no matching
      # manifest" — there is no image to emulate. Listing them only produced
      # fake-green skips (verified empirically), so they are dropped rather than
      # pretended-tested.
      matrix:
        include:
          - { version: "22.03",   arch: "x86-64", image: "x86-64-v22.03.7" }
          - { version: "23.05",   arch: "x86-64", image: "x86-64-v23.05.6" }
          - { version: "24.10.1", arch: "x86-64", image: "x86-64-v24.10.1" }
          - { version: "24.10.6", arch: "x86-64", image: "x86-64-v24.10.6" }
          - { version: "25.12.0", arch: "x86-64", image: "x86-64-v25.12.0" }
          - { version: "25.12.4", arch: "x86-64", image: "x86-64-v25.12.4" }
          - { version: "snapshot", arch: "x86-64", image: "x86-64-snapshot" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.package_artifact || 'packages' }}
          path: dist/

      - name: Determine package format
        id: fmt
        run: |
          case "${{ matrix.version }}" in
            25.*|snapshot) echo "format=apk" >> "$GITHUB_OUTPUT" ;;
            *)             echo "format=ipk" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install and verify in OpenWrt ${{ matrix.version }} (${{ matrix.arch }})
        run: |
          IMAGE="ghcr.io/openwrt/rootfs:${{ matrix.image }}"
          # x86-64 images are always pullable; a pull failure here is a real
          # problem (registry/availability), so fail rather than skip.
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "$IMAGE" 2>/tmp/pull-err; then pulled=1; break; fi
            echo "docker pull attempt $attempt for $IMAGE failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          if [ "$pulled" != "1" ]; then
            cat /tmp/pull-err >&2
            echo "::error::Could not pull $IMAGE after 3 attempts"
            exit 1
          fi
          # Addressed through the version-free aliases both builders create,
          # so this works whether the packages came from this workflow's own
          # build or from the caller's release build.
          # Both packages, backend first: luci-app-trafficctl depends on it.
          EXT="${{ steps.fmt.outputs.format }}"
          set +e
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD/dist:/dist" \
            -v "$PWD/tests:/tests" \
            "$IMAGE" \
            /tests/test_install.sh "/dist/trafficctl.$EXT" "/dist/luci-app-trafficctl.$EXT"
          rc=$?
          set -e
          # 78 means the image's package feeds were unreachable, so the test
          # could not resolve dependencies and never got to judge our package.
          # Tolerated ONLY for the rolling snapshot target, whose feeds are
          # rebuilt continuously and are legitimately unavailable at times.
          # A pinned release with dead feeds is itself worth a red build, and
          # any other failure stays red everywhere.
          if [ "$rc" = "78" ]; then
            if [ "${{ matrix.version }}" = "snapshot" ]; then
              echo "::warning::snapshot feeds unavailable — package not verified on snapshot this run"
              exit 0
            fi
            echo "::error::package feeds unavailable for ${{ matrix.version }} (pinned release — not tolerated)"
            exit 1
          fi
          exit $rc

  # What the ucode port can rely on in the oldest and newest rootfs. Reports
  # only: a finding changes the port, not the build, so only a pull fails it.
  ucode-probe:
    name: ucode probe ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["22.03.7", "25.12.4"]
    steps:
      - name: Probe ucode, nft and tc
        run: |
          IMAGE="ghcr.io/openwrt/rootfs:x86-64-v${{ matrix.version }}"
          for attempt in 1 2 3; do
            docker pull -q "$IMAGE" && break
            [ "$attempt" = 3 ] && { echo "::error::Could not pull $IMAGE"; exit 1; }
            sleep $((attempt * 5))
          done
          sudo modprobe sch_htb || true
          docker run -i --rm --cap-add NET_ADMIN --entrypoint /bin/sh "$IMAGE" -s <<'PROBE' || true
          mkdir -p /var/lock /var/log
          pkgs() { opkg list-installed 2>/dev/null || apk info -v 2>/dev/null; }
          have() { pkgs | grep -qE "^$1( |-[0-9])"; }
          add() { if command -v opkg >/dev/null; then opkg install "$@"; else apk add "$@"; fi >/dev/null 2>&1; }
          echo "== release: $(. /etc/openwrt_release; echo "$DISTRIB_RELEASE")"
          echo "== ucode -v"; ucode -v 2>&1; echo "(rc=$?)"
          echo "== packages"; pkgs | grep -E '^(ucode|libucode|firewall4|nftables|rpcd|jsonfilter|libubox|ubus|uci)' | sort
          echo "== /usr/lib/ucode"; ls /usr/lib/ucode
          for p in firewall4 nftables-json ucode-mod-fs ucode-mod-ubus ucode-mod-uci rpcd-mod-ucode; do
              have "$p" && echo "  $p: yes" || echo "  $p: no"
          done
          echo "== brctl: $(command -v brctl || echo missing)"
          echo "== nft -j list tables"; nft -j list tables 2>&1; echo "(rc=$?)"
          # The rootfs ships no tc.
          { opkg update || apk update; } >/dev/null 2>&1
          command -v tc >/dev/null || add tc-tiny
          if tc qdisc add dev eth0 root handle 1: htb default fffe &&
             tc class add dev eth0 parent 1: classid 1:1 htb rate 100mbit &&
             tc class add dev eth0 parent 1:1 classid 1:2 htb rate 10mbit ceil 20mbit; then
              echo "== tc -j class show"; tc -j class show dev eth0; echo "(rc=$?)"
              echo "== tc -j -s class show"; tc -j -s class show dev eth0
              echo "== tc -j qdisc show"; tc -j qdisc show dev eth0
          else
              echo "== HTB not available"
          fi
          PROBE

  # The read-only nft/tc readers on real kernel state: the current shell
  # writers build blocks, limits and shapes in an OpenWrt rootfs, and the
  # v1.30.0 shell readers and the ucode CLI must report the same (see
  # tools/ci/live-compare.sh for the one difference nft 1.1 brings).
  live-readers:
    name: Live readers ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "22.03.7"
            nft: "1.0"
          - version: "25.12.4"
            nft: "1.1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build state and read it back in OpenWrt ${{ matrix.version }}
        run: |
          IMAGE="ghcr.io/openwrt/rootfs:x86-64-v${{ matrix.version }}"
          for attempt in 1 2 3; do
            docker pull -q "$IMAGE" && break
            [ "$attempt" = 3 ] && { echo "::error::Could not pull $IMAGE"; exit 1; }
            sleep $((attempt * 5))
          done
          # A container cannot load modules; the writers need these.
          for m in sch_htb sch_fq_codel sch_ingress ifb act_mirred cls_u32 \
                   nf_tables nft_limit nft_ct; do
            sudo modprobe "$m" || echo "::warning::no module $m"
          done
          git fetch -q --depth=1 origin "refs/tags/v1.30.0:refs/tags/v1.30.0" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/legacy" "$RUNNER_TEMP/out"
          git archive v1.30.0 trafficctl/files | tar -x -C "$RUNNER_TEMP/legacy"
          docker run --rm --cap-add NET_ADMIN --tmpfs /work:size=300m,exec \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/legacy/trafficctl/files:/legacy:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            --entrypoint /bin/sh "$IMAGE" /src/tools/ci/live-readers.sh
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/out"
          tools/ci/live-compare.sh "$RUNNER_TEMP/out" "${{ matrix.nft }}"

  # ── PR7: the global cut on a real kernel ──
  # A cut engaged by v1.30.0's trafficctl-cut.sh is released by
  # `trafficctl cut` and the other way round, the router-local accept is the
  # first prerouting rule nft lists back whoever installed it, and with no LAN
  # device both refuse (tools/ci/live-cut.sh).
  live-cut:
    name: Live cut ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["22.03.7", "24.10.6", "25.12.4"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Engage and release across versions in OpenWrt ${{ matrix.version }}
        run: |
          IMAGE="ghcr.io/openwrt/rootfs:x86-64-v${{ matrix.version }}"
          for attempt in 1 2 3; do
            docker pull -q "$IMAGE" && break
            [ "$attempt" = 3 ] && { echo "::error::Could not pull $IMAGE"; exit 1; }
            sleep $((attempt * 5))
          done
          # A container cannot load modules; the cut's prerouting chain needs fib.
          for m in nf_tables nft_fib nft_fib_inet nft_fib_ipv4 nft_fib_ipv6 nft_ct bridge dummy; do
            sudo modprobe "$m" || echo "::warning::no module $m"
          done
          git fetch -q --depth=1 origin "refs/tags/v1.30.0:refs/tags/v1.30.0" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/legacy"
          git archive v1.30.0 trafficctl/files | tar -x -C "$RUNNER_TEMP/legacy"
          docker run --rm --cap-add NET_ADMIN --tmpfs /work:size=300m,exec \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/legacy/trafficctl/files:/legacy:ro" \
            --entrypoint /bin/sh "$IMAGE" /src/tools/ci/live-cut.sh
  # ── end PR7 ──

  # ──────────────────────────────────────────────────────────────────────────
  # Upgrade — install previous GitHub release, then install current build.
  # Verifies pre-upgrade/post-upgrade hooks, config file preservation.
  # ──────────────────────────────────────────────────────────────────────────
  upgrade:
    name: Upgrade ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: build-packages
    # build-packages is SKIPPED in the reuse case, and a job with an unmet
    # `needs` is skipped too — which would silently turn the whole matrix
    # green-by-absence on every release. The result is therefore tested
    # explicitly: run unless it actually failed.
    if: ${{ !cancelled() && needs.build-packages.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        # Only test IPK upgrade for now — APK releases prior to the fix in
        # this branch are broken (issue #7), so APK upgrade is gated on a
        # known-good baseline being released first.
        include:
          - { version: "23.05.6", image: "x86-64-v23.05.6", format: "ipk" }
          - { version: "24.10.6", image: "x86-64-v24.10.6", format: "ipk" }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.package_artifact || 'packages' }}
          path: dist/

      - name: Download previous release
        run: |
          mkdir -p dist-old
          # Find the latest published release prior to current
          PREV_TAG=$(gh release list --limit 5 --json tagName,isLatest \
                     --jq '.[] | select(.isLatest == true) | .tagName')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Previous release: $PREV_TAG"
          if ! gh release download "$PREV_TAG" \
               -p "*.${{ matrix.format }}" -D dist-old 2>/tmp/dl-err; then
            cat /tmp/dl-err >&2
            echo "::warning::Could not download previous release $PREV_TAG, skipping"
            exit 0
          fi
          ls -la dist-old/

      - name: Run upgrade test
        run: |
          # The old package stays in its OWN directory and is mounted
          # separately. It used to be moved into dist/ to make the path
          # container-relative, and that is a trap now that both builds
          # publish a version-free alias: a release's assets include
          # luci-app-trafficctl.ipk, so `mv` landed the OLD package on top of
          # the new one and the test upgraded 1.21.4 to 1.21.4 — reporting
          # "version unchanged after upgrade", which is how this was caught.
          # Two mounts, no renaming, no name that can collide.
          OLD_PKG=$(ls dist-old/luci-app-trafficctl*.${{ matrix.format }} 2>/dev/null | head -1)
          if [ -z "$OLD_PKG" ]; then
            echo "::warning::No previous package downloaded, skipping upgrade test"
            exit 0
          fi
          OLD_PKGS="/dist-old/$(basename "$OLD_PKG")"
          # Releases up to 1.28.x are one package; later ones also ship the
          # backend as trafficctl, which then has to be part of the old install.
          OLD_BE=$(find dist-old -maxdepth 1 -name 'trafficctl*.${{ matrix.format }}' | sort | head -1)
          [ -n "$OLD_BE" ] && OLD_PKGS="/dist-old/$(basename "$OLD_BE") $OLD_PKGS"
          echo "Old packages: $OLD_PKGS"

          IMAGE="ghcr.io/openwrt/rootfs:${{ matrix.image }}"
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then pulled=1; break; fi
            sleep $((attempt * 5))
          done
          [ "$pulled" = "1" ] || { echo "::error::Could not pull $IMAGE after 3 attempts"; exit 1; }
          # shellcheck disable=SC2086 # OLD_PKGS is a list of package files
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD/dist:/dist" \
            -v "$PWD/dist-old:/dist-old" \
            -v "$PWD/tests:/tests" \
            "$IMAGE" \
            /tests/test_upgrade.sh $OLD_PKGS -- /dist/trafficctl.ipk /dist/luci-app-trafficctl.ipk

  # ──────────────────────────────────────────────────────────────────────────
  # Dependencies — verify install fails cleanly when deps are missing, and
  # that opkg update + install correctly resolves them.
  # ──────────────────────────────────────────────────────────────────────────
  dependencies:
    name: Dependencies ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: build-packages
    # build-packages is SKIPPED in the reuse case, and a job with an unmet
    # `needs` is skipped too — which would silently turn the whole matrix
    # green-by-absence on every release. The result is therefore tested
    # explicitly: run unless it actually failed.
    if: ${{ !cancelled() && needs.build-packages.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "23.05.6", image: "x86-64-v23.05.6", format: "ipk" }
          - { version: "24.10.6", image: "x86-64-v24.10.6", format: "ipk" }
          - { version: "25.12.4", image: "x86-64-v25.12.4", format: "apk" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.package_artifact || 'packages' }}
          path: dist/

      - name: Run dependency test
        run: |
          EXT="${{ matrix.format }}"
          IMAGE="ghcr.io/openwrt/rootfs:${{ matrix.image }}"
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then pulled=1; break; fi
            sleep $((attempt * 5))
          done
          [ "$pulled" = "1" ] || { echo "::error::Could not pull $IMAGE after 3 attempts"; exit 1; }
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD/dist:/dist" \
            -v "$PWD/tests:/tests" \
            "$IMAGE" \
            /tests/test_dependencies.sh "/dist/trafficctl.$EXT" "/dist/luci-app-trafficctl.$EXT"
