name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges landing seconds apart each start a release job; they then race
# on `git push origin main <tag>`, and the loser dies with "failed to push
# some refs" after having already tagged. Serialise them, and never cancel
# a run mid-release — a half-finished release leaves a tag with no artifacts.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  compat:
    name: Compatibility checks
    uses: ./.github/workflows/compat.yml

  release:
    name: Tag, release & build
    runs-on: ubuntu-latest
    needs: [ci, compat]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            # Fresh fork / repo without tags: continue versioning from the
            # Makefile instead of restarting at v0.0.0 (which would downgrade
            # PKG_VERSION on the first release).
            MKV=$(sed -n 's/^PKG_VERSION:=//p' luci-app-trafficctl/Makefile | head -1)
            LATEST_TAG="v${MKV:-0.0.0}"
            echo "No tags found — using Makefile version as baseline: $LATEST_TAG"
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Get commits since last tag. Keep subjects and full messages (with
          # body) separate: the type-prefix regexes below are subject-anchored
          # (^feat:, ^fix!:, ...) and must only match the subject line, but
          # `grep` matches per input line, so if a BREAKING CHANGE footer were
          # folded into the same variable a body line starting with e.g.
          # "feat:" would also satisfy a subject regex. So subject-prefix
          # detection runs against SUBJECTS only, while the free-text
          # BREAKING CHANGE footer search runs against the full message
          # (subject+body) via FULL_MSGS.
          #
          # That footer search is anchored too. Conventional Commits defines
          # BREAKING CHANGE as a footer — start of line, followed by ":" or
          # " #" — so an unanchored match turns any prose *mentioning* the
          # footer into a major release. This very workflow's own commit
          # message described the footer in a sentence and would have shipped
          # v2.0.0 off a patch-only branch.
          SUBJECTS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          FULL_MSGS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null || git log --pretty=format:"%s%n%b")

          # Determine bump type
          BUMP="none"
          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?!:|^fix(\(.+\))?!:' || echo "$FULL_MSGS" | grep -qE '^BREAKING[ -]CHANGE(:| #)'; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          elif echo "$SUBJECTS" | grep -qE '^fix(\(.+\))?:|^perf(\(.+\))?:|^refactor(\(.+\))?:|^ci(\(.+\))?:'; then
            BUMP="patch"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits since $LATEST_TAG"
            exit 0
          fi

          # Calculate new version
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.bump.outputs.bump != 'none'
        run: |
          TAG="${{ steps.bump.outputs.latest_tag }}"
          REPO="${{ github.repository }}"

          # The baseline may come from the Makefile (fork without tags) and
          # not exist as a git ref — fall back to the full history then.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            RANGE="${TAG}..HEAD"
            HAVE_TAG=1
          else
            RANGE="HEAD"
            HAVE_TAG=0
          fi

          # Print one Markdown bullet per commit matching $TYPE_REGEX.
          # Format:  - <subject without prefix> ([short-sha](commit-url))
          #          <up to the first body paragraph, indented> (optional)
          # The regex reaches awk through the ENVIRONMENT, not -v. awk processes
          # escape sequences in a -v value, and `\(` is not one it knows, so it
          # substituted a plain `(` and warned — turning the optional scope group
          # `(\(...\))?` into a mandatory literal one. Every `fix(scope):` commit
          # then failed to match while `fixup:`/`fixes:` started matching, so
          # v1.13.2's notes lost their whole Bug Fixes section. ENVIRON values are
          # passed through verbatim. (The fault only shows on gawk, which the
          # GitHub runners use; mawk accepts the -v form, so this cannot be
          # reproduced on a machine where /usr/bin/awk is mawk or BSD awk.)
          format_section() {
            type_regex="$1"
            git log "$RANGE" --reverse --pretty=format:'%H%x09%s%x09%b%x1e' |
              tr -d '\r' |
              TYPE_RE="^${type_regex}(\\([^)]*\\))?:" \
              awk -v repo="$REPO" '
                BEGIN { RS = "\x1e"; FS = "\t"; type_re = ENVIRON["TYPE_RE"] }
                {
                  sha=$1; subj=$2; body=$3
                  # Strip whitespace/newlines that creep in between records.
                  gsub(/^[ \t\n\r]+|[ \t\n\r]+$/, "", sha)
                  gsub(/^[ \t]+|[ \t]+$/, "", subj)
                  if (subj !~ type_re) next
                  short=substr(sha,1,7)
                  # Strip "type(scope): " prefix.
                  sub(type_re " *", "", subj)
                  # Auto-link bare "#NN" refs to PR/issue.
                  # Consume the subject left to right, appending to `out`, so a
                  # replacement is never rescanned. Rewriting `subj` in place and
                  # re-matching from the start loops forever: the substitution
                  # itself contains "#NN" (inside "[#NN](...)"), so match() keeps
                  # finding it and the string grows without bound. Any commit
                  # subject carrying an issue ref would hang the release job.
                  out = ""; rest = subj
                  while (match(rest, /#[0-9]+/)) {
                    n = substr(rest, RSTART+1, RLENGTH-1)
                    out = out substr(rest,1,RSTART-1) "[#" n "](https://github.com/" repo "/issues/" n ")"
                    rest = substr(rest, RSTART+RLENGTH)
                  }
                  subj = out rest
                  printf "- %s ([%s](https://github.com/%s/commit/%s))\n", subj, short, repo, sha

                  # Emit body lines, stopping at first blank line (lead
                  # paragraph only) — keeps squash-merge bodies from
                  # flooding the release notes with nested bullets.
                  n = split(body, lines, "\n")
                  printed = 0
                  for (i=1; i<=n; i++) {
                    L = lines[i]
                    gsub(/^[ \t]+|[ \t]+$/, "", L)
                    # Stop at first blank line after we have already printed
                    # at least one body line — that ends the lead paragraph.
                    if (L == "") { if (printed) break; else continue }
                    if (L ~ /^(Signed-off-by|Co-[Aa]uthored-[Bb]y|Reviewed-by|Reported-by|BREAKING CHANGE|Release-As):/) continue
                    # Skip nested squash bullets (e.g. "* fix: ...") and
                    # trailing horizontal rules from PR descriptions.
                    if (L ~ /^\*[ \t]+(feat|fix|chore|docs|ci|refactor|perf|test|build|style|revert)(\([^)]*\))?:/) continue
                    if (L ~ /^-{3,}$/) continue
                    printf "  %s\n", L
                    printed++
                    if (printed >= 6) break
                  }
                }
              '
          }

          {
            echo 'body<<CHANGELOG_EOF'
            echo "## What's Changed"
            echo ""

            FEATS=$(format_section "feat")
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi

            FIXES=$(format_section "fix")
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            PERF=$(format_section "perf")
            if [ -n "$PERF" ]; then
              echo "### Performance"
              echo "$PERF"
              echo ""
            fi

            OTHER=$(format_section "(refactor|ci)")
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo ""
            fi

            if [ "$HAVE_TAG" = "1" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${TAG}...${{ steps.bump.outputs.new_tag }}"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### Download"
            echo ""
            echo "| File | OpenWrt version | Install command |"
            echo "|------|----------------|-----------------|"
            echo "| \`luci-app-trafficctl.ipk\` | 21.02 — 24.10 | \`opkg install <file>\` |"
            echo "| \`luci-app-trafficctl.apk\` | 25.12+ | \`apk add --allow-untrusted <file>\` |"
            echo ""
            echo "Stable URL (always points to the latest release):"
            echo "\`\`\`"
            echo "wget https://github.com/${{ github.repository }}/releases/latest/download/luci-app-trafficctl.ipk"
            echo "wget https://github.com/${{ github.repository }}/releases/latest/download/luci-app-trafficctl.apk"
            echo "\`\`\`"
            echo ""
            echo "Other filenames (\`_all.ipk\`, \`_noarch.apk\`, versioned) are the same file."
            echo ""
            echo "### Upgrading an existing install"
            echo ""
            echo "Install over the current version — both package managers upgrade in"
            echo "place, so there is no need to remove the old one first."
            echo ""
            echo "\`\`\`sh"
            echo "cd /tmp"
            echo "# OpenWrt 21.02 - 24.10"
            echo "wget https://github.com/${{ github.repository }}/releases/latest/download/luci-app-trafficctl.ipk"
            echo "opkg install /tmp/luci-app-trafficctl.ipk"
            echo ""
            echo "# OpenWrt 25.12+ / snapshot"
            echo "wget https://github.com/${{ github.repository }}/releases/latest/download/luci-app-trafficctl.apk"
            echo "apk add --allow-untrusted /tmp/luci-app-trafficctl.apk"
            echo ""
            echo "# required either way - rpcd caches the backend"
            echo "/etc/init.d/rpcd restart"
            echo "# only if the Telegram bot is enabled"
            echo "/etc/init.d/trafficctl-telegram restart"
            echo "\`\`\`"
            echo ""
            echo "Your settings are kept: \`/etc/config/trafficctl\` is a conffile, so the"
            echo "package manager preserves it and writes the new defaults alongside as"
            echo "\`/etc/config/trafficctl-opkg\`, which you can delete."
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Makefile version and tag
        if: steps.bump.outputs.bump != 'none'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          NOTES_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.bump.outputs.new_version }}/" luci-app-trafficctl/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" luci-app-trafficctl/Makefile
          # Fail loudly if the substitution did not take (e.g. Makefile format
          # changed) instead of tagging a release with an unbumped version.
          grep -qx "PKG_VERSION:=${{ steps.bump.outputs.new_version }}" luci-app-trafficctl/Makefile \
            || { echo "ERROR: PKG_VERSION was not updated in the Makefile"; exit 1; }
          # Keep CHANGELOG.md current. The release notes are already generated by
          # the "Generate changelog" step; without this they only ever landed on
          # the GitHub Releases page while the file itself drifted out of date.
          python3 - <<'PYEOF'
          import os, re, datetime
          ver  = os.environ['NEW_VERSION']
          body = os.environ['NOTES_BODY']
          path = 'CHANGELOG.md'
          today = datetime.date.today().isoformat()
          with open(path) as fh:
              text = fh.read()
          # Already documented (e.g. a workflow re-run) -> leave the file alone.
          if re.search(r'^## \[%s\]' % re.escape(ver), text, re.M):
              raise SystemExit(0)
          # Drop the generated heading; the version heading replaces it.
          body = re.sub(r"^## What's Changed\s*", '', body).strip()
          # The release body also carries a download table and install commands.
          # Useful on the Releases page, pure noise repeated in every changelog
          # entry — drop that section but keep everything above it.
          trimmed = re.split(r'\n-{3,}\s*\n+### Download', body)[0].strip()
          body = trimmed or body
          entry = '## [%s] - %s\n\n%s\n\n---\n\n' % (ver, today, body)
          i = text.find('\n## [')
          text = (text[:i + 1] + entry + text[i + 1:]) if i != -1 else (text.rstrip() + '\n\n' + entry)
          with open(path, 'w') as fh:
              fh.write(text)
          PYEOF
          git add luci-app-trafficctl/Makefile CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          # main may have advanced while CI ran; rebase rather than fail. The
          # rebase rewrites the bump commit, so the tag must be created AFTER
          # it — otherwise the tag points at an object no branch contains.
          git pull --rebase origin main
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin main "${{ steps.bump.outputs.new_tag }}"

      - name: Build .ipk (standalone)
        if: steps.bump.outputs.bump != 'none'
        run: |
          ./build-ipk.sh "${{ steps.bump.outputs.new_version }}" 1
          ln -f dist/luci-app-trafficctl_*_all.ipk dist/luci-app-trafficctl_all.ipk
          ln -f dist/luci-app-trafficctl_*_all.ipk dist/luci-app-trafficctl.ipk
          cp dist/*.ipk /tmp/

      # Secrets are not readable from step `if:` expressions, so detect them
      # in a run step. Forks won't have the upstream signing keys — they get
      # an unsigned APK from build-apk.sh instead of a failed release.
      - name: Check APK signing secrets
        id: apk_secrets
        if: steps.bump.outputs.bump != 'none'
        env:
          APK_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          if [ -n "$APK_KEY" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::notice::APK signing secrets not configured — building unsigned APK with build-apk.sh (installable with 'apk add --allow-untrusted')"
          fi

      - name: Build .apk (via OpenWrt SDK, signed)
        if: steps.bump.outputs.bump != 'none' && steps.apk_secrets.outputs.have == '1'
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: x86_64-25.12.4
          FEEDNAME: trafficctl
          PACKAGES: luci-app-trafficctl
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          V: sc
          KEY_BUILD: ${{ secrets.USIGN_PRIVATE_KEY }}

      - name: Collect APK
        if: steps.bump.outputs.bump != 'none' && steps.apk_secrets.outputs.have == '1'
        run: |
          mkdir -p dist
          # luci-i18n-trafficctl-* as well as the main package: build-ipk.sh
          # emits one translation package per language and the SDK action wiped
          # dist/, so a glob anchored on the main package name drops them.
          cp /tmp/luci-*trafficctl*.ipk dist/ 2>/dev/null || true
          # The SDK builds the translation subpackages alongside the main one.
          find bin/ -name "luci-i18n-trafficctl-*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          APK=$(find bin/ -name "luci-app-trafficctl*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "dist/luci-app-trafficctl_${{ steps.bump.outputs.new_version }}-r1_noarch.apk"
            ln -f "dist/luci-app-trafficctl_${{ steps.bump.outputs.new_version }}-r1_noarch.apk" dist/luci-app-trafficctl_noarch.apk
            ln -f "dist/luci-app-trafficctl_${{ steps.bump.outputs.new_version }}-r1_noarch.apk" dist/luci-app-trafficctl.apk
          else
            echo "::error::APK not found in SDK output"
            find bin/ -type f -name "*.apk" || true
            exit 1
          fi

      - name: Build .apk (standalone, unsigned fallback)
        if: steps.bump.outputs.bump != 'none' && steps.apk_secrets.outputs.have != '1'
        run: |
          # build-apk.sh's fallback layout is NOT installable by apk-tools 3
          # (see build-apk.sh) — it is a known-broken artifact, so it must not
          # be uploaded as a release asset. Build it only to keep this path
          # exercised, then deliberately drop it instead of copying it into
          # dist/ where the release step's `dist/*.apk` glob would pick it up.
          APK_FILE=$(sh build-apk.sh "${{ steps.bump.outputs.new_version }}" 1 | tail -1)
          if [ -f "$APK_FILE" ]; then
            echo "::warning::APK signing secrets not configured — built APK is unsigned and not installable by apk-tools 3, omitting it from the release (IPK only)"
          else
            echo "::warning::build-apk.sh produced no APK — releasing IPK only"
          fi

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: ${{ steps.bump.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.ipk
            dist/*.apk
