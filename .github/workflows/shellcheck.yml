name: ShellCheck

on:
  # Called by ci.yml only. A standalone push/pull_request trigger here made
  # every check run twice on a pull request — once on its own and once nested
  # inside ci.yml, which is why the checks list carried both "ShellCheck" and
  # "shellcheck / ShellCheck" — and three times on a push to main, where
  # auto-release.yml calls ci.yml again.
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Explicit scan of EVERY shell script (detected by shebang), failing on
      # any warning or error. The previous ludeeus/action-shellcheck step only
      # scanned root/usr/local/bin: its `additional_files` were passed as full
      # paths but the action treats them as `find -name` basename globs, so the
      # init.d / rpcd / hotplug scripts were silently never checked.
      - name: Run ShellCheck (warnings fail)
        run: |
          shellcheck --version
          mapfile -t files < <(
            grep -rlE '^#!.*(sh|bash|dash|ash)' \
              luci-app-trafficctl/root build-ipk.sh build-apk.sh tests tools \
              | grep -v node_modules | sort -u
          )
          echo "Scanning ${#files[@]} shell scripts:"
          printf '  %s\n' "${files[@]}"
          shellcheck -x -e SC1091 -S warning "${files[@]}"
