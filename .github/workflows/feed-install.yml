name: OpenWrt Feed Install

# Split out of compat.yml, and for a measured regression rather than tidiness.
# This check reproduces the user-facing `./scripts/feeds update` workflow
# inside an SDK container (issue #7) and consumes NOTHING any other job
# builds — no artifact, no `needs`. While it lived in compat.yml it inherited
# that workflow's gating, so once compat started waiting for the release build
# in order to reuse its packages, this got dragged behind the build with it:
# 22 minutes of building and then 24 minutes of feed installing, serialised,
# where they had always overlapped.
#
# Measured: release run 38086343117 started feed-install at 21:28:58, one
# second after the build finished, against run 36936909066 where it started at
# 21:04:01 alongside the build. Net effect of the reuse change alone would
# have been ~46 minutes against the ~32 it replaced.
#
# Its own workflow makes the independence structural: there is no gate here to
# inherit.

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # A LITERAL name, not ${{ github.workflow }}. Inside a workflow_call that
  # expression resolves to the CALLER's workflow name, so ci.yml, compat.yml and
  # feed-install.yml all computed the same group when the release called them —
  # 'Auto Release-pr-<run_id>' — and GitHub serialised the three against each
  # other. With cancel-in-progress false a group holds one running and one
  # pending run, so whichever of the three was queued got CANCELLED when the
  # third arrived.
  #
  # Measured on release run 38299207220: feeds took the slot at 19:54:25, ci sat
  # queued for twenty minutes, and the moment compat became eligible (20:14:57,
  # one second after the build finished) ci was cancelled. publish needs ci, so
  # it was skipped and #92 was merged without ever being released. The same
  # serialisation is visible in the runs that did succeed: compat's matrix
  # started in the same second feeds finished.
  group: feeds-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feed-install:
    name: Feed install (SDK ${{ matrix.version }})
    runs-on: ubuntu-latest
    # The earlier lua.h SDK-environment problem is worked around in
    # test_feed_install.sh (it disables the liblucihttp-lua/ucode deps), so this
    # job now passes on every supported SDK and is a BLOCKING check again —
    # a feed-install regression (e.g. issue #7 recurring) must fail CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "23.05.6",  sdk_image: "openwrt/sdk:x86_64-23.05.6" }
          - { version: "24.10.6",  sdk_image: "openwrt/sdk:x86_64-24.10.6" }
          - { version: "25.12.4",  sdk_image: "openwrt/sdk:x86_64-25.12.4" }
    steps:
      - uses: actions/checkout@v6

      # The official feeds and the compiled dependencies, carried between
      # runs (tools/sdk-cache.sh); our feed is never in the cache. Keyed per
      # SDK image digest, so each matrix entry has its own.
      - name: Compute the OpenWrt SDK cache key
        id: sdk_cache_key
        run: |
          pulled=0
          for attempt in 1 2 3; do
            if docker pull -q "${{ matrix.sdk_image }}"; then pulled=1; break; fi
            echo "docker pull attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          [ "$pulled" = 1 ] || exit 0
          read -r key prefix < <(tools/sdk-cache.sh key "${{ matrix.sdk_image }}" tests/test_feed_install.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "SDK cache key: $key"

      - name: Restore the OpenWrt SDK cache
        id: sdk_cache
        if: steps.sdk_cache_key.outputs.key != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: ${{ steps.sdk_cache_key.outputs.key }}
          restore-keys: ${{ steps.sdk_cache_key.outputs.prefix }}

      - name: Run feed install test in ${{ matrix.sdk_image }}
        env:
          SDK_CACHE: ${{ runner.temp }}/sdk-cache
          # An exact hit is saved already; rewriting the archive would be waste.
          SDK_CACHE_SAVE: ${{ steps.sdk_cache.outputs.cache-hit == 'true' && '0' || '1' }}
        run: |
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "${{ matrix.sdk_image }}"; then pulled=1; break; fi
            echo "docker pull attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          if [ "$pulled" != "1" ]; then
            echo "::warning::SDK image ${{ matrix.sdk_image }} not pullable, skipping"
            exit 0
          fi
          # The image runs as buildbot (uid 1000), which writes the cache.
          mkdir -p "$SDK_CACHE"
          sudo chown -R 1000:1000 "$SDK_CACHE"
          ret=0
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$SDK_CACHE:/sdk-cache" \
            --env SDK_CACHE_DIR=/sdk-cache \
            --env SDK_CACHE_SAVE \
            --entrypoint /bin/sh \
            "${{ matrix.sdk_image }}" \
            /src/tests/test_feed_install.sh /src || ret=$?
          # Back to the runner user, so actions/cache can archive it.
          sudo chown -R "$(id -u):$(id -g)" "$SDK_CACHE"
          exit "$ret"

