name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Mock Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The runner has gawk and mawk, both 64-bit clean on "%d". The byte
      # overflow the exporter hits is a busybox-awk behaviour, so without
      # busybox here test_byte_overflow.sh passes whether or not the bug is
      # present. mawk is pulled in for the same reason test_changelog_gen.sh
      # wants several awks: the interpreters disagree.
      - name: Install extra awk implementations
        run: sudo apt-get install -y --no-install-recommends busybox-static mawk
      - name: Shell unit tests
        run: bash tests/test_fw.sh
      - name: nft bytes parser tests
        run: bash tests/test_bytes_nft.sh
      - name: Port-forward control tests
        run: bash tests/test_portfw.sh
      - name: Device naming tests
        run: bash tests/test_names.sh
      - name: Netify (DPI) integration tests
        run: bash tests/test_netify.sh
      - name: Bidirectional limit/shape tests
        run: bash tests/test_direction.sh
      - name: Cumulative byte counter tests
        run: bash tests/test_totals.sh
      - name: Prometheus exporter tests
        run: bash tests/test_metrics.sh
      - name: Telegram unit tests
        run: bash tests/test_telegram.sh
      - name: Telegram mock tests
        run: bash tests/test_telegram_mock.sh
      - name: Telegram E2E tests
        run: bash tests/test_telegram_e2e.sh
      - name: Security tests
        run: bash tests/test_security.sh
      - name: rpcd backend tests
        run: bash tests/test_rpcd.sh
      - name: Block/unblock tests
        run: bash tests/test_block.sh
      - name: WiFi MAC filter tests
        run: bash tests/test_macfilter.sh
      - name: Metrics CGI endpoint tests
        run: bash tests/test_metrics_cgi.sh
      - name: Byte counter overflow tests
        run: bash tests/test_byte_overflow.sh
      - name: New device default-limit tests
        run: bash tests/test_newdevice.sh
      - name: Per-interface counter tests (global overview)
        run: bash tests/test_ifaces.sh
      - name: Regression tests
        run: bash tests/test_regressions.sh
      - name: Release version-bump tests
        run: bash tests/test_release_bump.sh
      - name: Release notes generator tests
        run: bash tests/test_changelog_gen.sh
      - name: IPK build test
        run: bash tests/test_build_ipk.sh

  telegram-integration:
    name: Telegram Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Telegram bot integration tests
        env:
          TEST_TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
        run: bash tests/test_telegram_integration.sh
